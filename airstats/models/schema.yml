models:
  - name: silver_airport_comments
    description: cleaned table which contains airport comments.
    columns:
    - name: comment_id
      description: '{{ doc("comment_id") }}'
      data_tests:
        - unique
        - not_null

    - name: airport_ident
      description: Foreign key to the airports table.
      data_tests:
        - not_null
        - relationships:
            to: ref('silver_airports')
            field: airport_ident
            config:
              severity: warn

    - name: comment_timestamp
      description: Timestamp of the comment.
    
    - name: member_nickname
      description: '{{ doc("member_nickname") }}'

    - name: comment_subject
      description: Subject of the comment.
    
    - name: comment_body
      description: Body of the comment.
    
    - name: loaded_at 
      description: Timestamp when the record was loaded into the table.


  - name: silver_airports
    description: cleaned table which contains airport information.
    columns:
    - name: airport_ident
      description: Primary key for the airports.
      data_tests:
        - not_null
        - unique

    - name: airport_type
      description: Type of the airport.
      data_tests:
        - accepted_values:
            values: ["small_airport", "medium_airport", "large_airport", "heliport", "seaplane_base", "closed", "balloonport"]


    - name: airport_name
      description: Name of the airport.

    - name: airport_lat
      description: Latitude of the airport.
      data_tests:
        - dbt_expectations.expect_column_values_to_be_of_type:
            column_type: number
    
    - name: airport_long
      description: Longitude of the airport.
      data_tests:
        - dbt_expectations.expect_column_values_to_be_of_type:
            column_type: number


    - name: continent
      description: Continent where the airport is located.
    
    - name: iso_country
      description: ISO country code where the airport is located.
    
    - name: iso_region
      description: ISO region code where the airport is located.
    

  - name: silver_runways
    description: cleaned table which contains runway information.
    columns:
    - name: runway_id
      description: Primary key for the runways.
      data_tests:
        - not_null
        - unique

    - name: airport_ident
      description: Foreign key to the airports table.
      data_tests:
        - not_null
        - relationships:
            to: ref('silver_airports')
            field: airport_ident
            config:
              severity: warn

    - name: runway_length_ft
      description: Length of the runway in feet.
      data_tests:
        - dbt_expectations.expect_column_values_to_be_of_type:
            column_type: number  
    
    - name: runway_width_ft
      description: Width of the runway in feet.
      data_tests:
        - dbt_expectations.expect_column_values_to_be_of_type:
            column_type: number

    - name: runway_surface
      description: Surface type of the runway.
    

    - name: runway_lighted
      description: Indicates if the runway is lighted (1) or not (0).
  
    - name: runway_closed
      description: Indicates if the runway is closed (1) or not (0).
     

